  - id: TC-APP-CALLS-01
    title: Send Call page loads (no place-call)
    priority: P1
    asserts:
      - Send Call heading/form landmark
      - Place/Send control may exist — do not click final place/send
    risk: high
    implemented: suites/app/calls-sms-smoke.spec.ts
    note: Launch Call visible — not clicked
  - id: TC-APP-CALLS-02
    title: Call History list or empty state
    priority: P1
    asserts:
      - Table/list or Call History empty-state; URL/nav selected
    risk: medium
    implemented: suites/app/calls-sms-smoke.spec.ts
  - id: TC-APP-CALLS-03
    title: Batch Call section opens (read-only)
    priority: P1
    asserts:
      - Batch Call UI or empty state; no start batch / confirm send
    risk: high
    implemented: suites/app/calls-sms-smoke.spec.ts
  - id: TC-APP-CALLS-04
    title: Send Call required-field validation (abort)
    priority: P2
    asserts:
      - Validation visible; no outbound call (intercept OK)
    risk: high
  - id: TC-APP-CALLS-05
    title: Phone Numbers section read-only smoke
    priority: P1
    asserts:
      - Numbers list or empty state; Buy visible but not completed
    risk: high
    implemented: suites/app/calls-sms-smoke.spec.ts
    note: CTA label is Request Number — not completed

