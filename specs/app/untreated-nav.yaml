# Untreated nav domain stubs — Tasks / KB / CRM / SIP / AI
# Priority per PROJECT-DECISIONS.md

suite: app-untreated-nav
host: https://dev-app.helloalex.ai
auth: required
status: active

cases:
  - id: TC-APP-TASKS-01
    title: Tasks section opens
    asserts:
      - Tasks-specific landmark (heading or empty state)
      - No create/save that persists if risky — open only preferred
    risk: medium
  - id: TC-APP-KB-01
    title: Knowledge Base opens
    asserts:
      - KB list/empty landmark
      - No destructive delete
    risk: medium
  - id: TC-APP-CRM-01
    title: CRM section opens
    asserts:
      - CRM landmark
      - Do not click Connect / Sync that mutates live CRM
    risk: medium
  - id: TC-APP-SIP-01
    title: SIP Trunks section opens
    asserts:
      - SIP UI/empty landmark
      - Do not provision / create trunk
    risk: high
  - id: TC-APP-AI-01
    title: AI Intelligence section opens
    asserts:
      - Section landmark; read-only
    risk: medium
  - id: TC-APP-MEMORY-01
    title: Memory section opens
    asserts:
      - Memory UI/empty state
      - No wipe
    risk: medium
  - id: TC-APP-INTEG-01
    title: Integrations section opens
    asserts:
      - Integrations landmark
      - Do not complete OAuth / connect that mutates secrets
    risk: medium
  - id: TC-APP-SUPPORT-01
    title: Support page loads
    asserts:
      - Support content landmark
      - Submit out of scope
    risk: low
