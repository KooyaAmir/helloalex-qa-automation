# Untreated nav domain stubs — Tasks / KB / CRM / SIP / AI
# Priority per PROJECT-DECISIONS.md

suite: app-untreated-nav
host: https://dev-app.helloalex.ai
auth: required
status: active

cases:
  - id: TC-APP-TASKS-01
    title: Tasks section opens
    asserts:
      - Tasks-specific landmark (heading or empty state)
      - No create/save that persists if risky — open only preferred
    risk: medium
    implemented: suites/app/untreated-nav.spec.ts
    note: Destination-proof via assertNavDestination + Tasks landmark
  - id: TC-APP-TASKS-02
    title: New Task entry opens without save
    asserts:
      - New Task form (Name/Prompt) visible
      - Abandon via Cancel/Close; never Save
    risk: medium
    implemented: suites/app/untreated-nav.spec.ts
  - id: TC-APP-KB-01
    title: Knowledge Base opens
    asserts:
      - KB list/empty landmark
      - No destructive delete
    risk: medium
    implemented: suites/app/untreated-nav.spec.ts
    note: Destination-proof + KB-specific landmark (no bare empty/upload)
  - id: TC-APP-KB-02
    title: Create Knowledge Base entry without persist
    asserts:
      - Create Knowledge Base dialog opens
      - Cancel/Close; never Create persist
    risk: medium
    implemented: suites/app/untreated-nav.spec.ts
  - id: TC-APP-CRM-01
    title: CRM section opens
    asserts:
      - CRM landmark
      - Do not click Connect / Sync that mutates live CRM
    risk: medium
    implemented: suites/app/untreated-nav.spec.ts
    note: Destination-proof via assertNavDestination + CRM landmark
  - id: TC-APP-CRM-02
    title: Sync controls visible without live sync
    asserts:
      - Sync Now / Connect / Configure may be visible
      - Never click live sync or connect
    risk: high
    implemented: suites/app/untreated-nav.spec.ts
  - id: TC-APP-SIP-01
    title: SIP Trunks section opens
    asserts:
      - SIP UI/empty landmark
      - Do not provision / create trunk
    risk: high
    implemented: suites/app/untreated-nav.spec.ts
    note: Destination-proof via assertNavDestination + SIP landmark
  - id: TC-APP-SIP-02
    title: SIP provision controls gated (no provision)
    asserts:
      - SIP heading plus provision CTA or empty/chrome copy
      - Never complete trunk provision (no tautological count >= 0)
    risk: high
    implemented: suites/app/untreated-nav.spec.ts
  - id: TC-APP-AI-01
    title: AI Intelligence section opens
    asserts:
      - Destination-proof + AI Intelligence heading (not bare "insights")
    risk: medium
    implemented: suites/app/untreated-nav.spec.ts
  - id: TC-APP-AI-02
    title: Generate Analysis control gated (no apply)
    asserts:
      - Generate Analysis visible
      - Do not run/apply analysis to pathways
    risk: medium
    implemented: suites/app/untreated-nav.spec.ts
  - id: TC-APP-MEMORY-01
    title: Memory section opens
    asserts:
      - Memory UI/empty state
      - No wipe
    risk: medium
    implemented: suites/app/untreated-nav.spec.ts
  - id: TC-APP-MEMORY-02
    title: Create Memory Store entry without persist
    asserts:
      - Create Memory Store entry opens
      - Abandon without persist / wipe
    risk: medium
    implemented: suites/app/untreated-nav.spec.ts
  - id: TC-APP-INTEG-01
    title: Integrations section opens
    asserts:
      - Integrations landmark
      - Do not complete OAuth / connect that mutates secrets
    risk: medium
    implemented: suites/app/untreated-nav.spec.ts
  - id: TC-APP-INTEG-02
    title: New API key entry without persist
    asserts:
      - New API key entry opens
      - Abandon before create/generate persist
    risk: high
    implemented: suites/app/untreated-nav.spec.ts
  - id: TC-APP-SUPPORT-01
    title: Support page loads
    asserts:
      - Support content landmark
      - Submit out of scope
    risk: low
    implemented: suites/app/untreated-nav.spec.ts
  - id: TC-APP-SUPPORT-02
    title: Support Tickets chrome without submit
    asserts:
      - Support Tickets tab/chrome visible
      - Do not submit a ticket
    risk: low
    implemented: suites/app/untreated-nav.spec.ts
