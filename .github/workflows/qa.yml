name: Hello Alex QA

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test --project=desktop
        env:
          BASE_URL: https://dev.helloalex.ai
      - run: node scripts/load-probe.mjs
        env:
          BASE_URL: https://dev.helloalex.ai
          USERS: "30"
          DURATION_S: "15"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-reports
          path: |
            reports/latest/
            playwright-report/
            test-results/
